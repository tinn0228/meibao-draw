.hint{margin:0 0 14px;color:var(--ink-soft);font-size:14px}

.deck{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.t-pink{--cc:var(--pink);--cc-ink:var(--pink-ink);--cc-soft:var(--pink-soft)}

.t-purple{--cc:var(--purple);--cc-ink:var(--purple-ink);--cc-soft:var(--purple-soft)}
.tarot{perspective:900px;border:0;background:none;padding:0;cursor:pointer;aspect-ratio:3/4;display:block;width:100%}
.tarot .in{display:block;position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.tarot.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border:1.5px solid var(--line);border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden}
.back{background:var(--cc);color:var(--cc-ink)}
.back::before{content:"";position:absolute;inset:8px;border:1.5px dashed currentColor;border-radius:12px;opacity:.55}
.back b{font-size:20px;font-weight:900;letter-spacing:.03em}
.back span{font-size:34px;font-weight:900;line-height:1}
.front{background:var(--card);transform:rotateY(180deg);text-align:center;padding:8px}
.front b{font-size:26px;font-weight:900}
.front small{font-size:12px;color:var(--ink-soft)}
.tarot:not(.flip):not([disabled]):hover .in{transform:translateY(-4px)}
.tarot[disabled]{cursor:default}
.tarot.dim{opacity:.35}
.tarot.pick .front{background:var(--cc-soft)}
@media(prefers-reduced-motion:reduce){.tarot .in{transition:none}}

.stars{display:flex;gap:3px}
.stars svg{width:22px;height:22px}
.rtitle{margin:0;font-size:28px;font-weight:900;line-height:1.25}

.rline{margin:0;font-size:17px}
.facts{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:0}

.fact dt{font-size:12px;color:var(--ink-soft);font-weight:700}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:10px 24px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-block;text-align:center}
.btn.main{background:var(--pink);color:var(--pink-ink);border-color:var(--pink)}
.linkish{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;color:var(--ink-soft);font-size:13px}
.note{font-size:13px;color:var(--ink-soft);margin:0}

.share{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:18px}

/* ---------- QR code（版本 2-M，純 JS） ---------- */
var QR=(function(){
  var EXP=[],LOG=[];
  (function(){ var x=1; for(var i=0;i<255;i++){ EXP[i]=x; LOG[x]=i; x<<=1; if(x&256) x^=0x11D; } for(var j=255;j<512;j++) EXP[j]=EXP[j-255]; })();

  function rsEc(data,n){ var g=rsGen(n),r=new Array(n).fill(0); data.forEach(function(b){ var f=b^r[0]; r.shift(); r.push(0); for(var i=0;i<n;i++) r[i]^=mul(g[i+1],f); }); return r; }
  function make(text){
    var size=25,DATA=28,ECN=16,data=Array.prototype.slice.call(new TextEncoder().encode(text));
    if(data.length>26) throw new Error("text too long");
    var bits=[]; function put(v,n){ for(var i=n-1;i>=0;i--) bits.push((v>>i)&1); }
    put(4,4); put(data.length,8); data.forEach(function(b){ put(b,8); });
    for(var t=0;t<4&&bits.length<DATA*8;t++) bits.push(0);
    while(bits.length%8) bits.push(0);
    for(var p=0xEC;bits.length<DATA*8;p=p===0xEC?0x11:0xEC) put(p,8);
    var cw=[]; for(var i=0;i<bits.length;i+=8){ var v=0; for(var k=0;k<8;k++) v=(v<<1)|bits[i+k]; cw.push(v); }
    cw=cw.concat(rsEc(cw,ECN));
    var all=[]; cw.forEach(function(b){ for(var i=7;i>=0;i--) all.push((b>>i)&1); });
    var m=[],fn=[]; for(var y=0;y<size;y++){ m.push(new Array(size).fill(false)); fn.push(new Array(size).fill(false)); }
    function setF(x,y,v){ if(x<0||y<0||x>=size||y>=size) return; m[y][x]=v; fn[y][x]=true; }
    function finder(cx,cy){ for(var dy=-4;dy<=4;dy++) for(var dx=-4;dx<=4;dx++){ var d=Math.max(Math.abs(dx),Math.abs(dy)); setF(cx+dx,cy+dy,d!==4&&d!==2); } }

    for(var a=0;a<size;a++){ if(!fn[6][a]) setF(a,6,a%2===0); if(!fn[a][6]) setF(6,a,a%2===0); }
    for(var ay=-2;ay<=2;ay++) for(var ax=-2;ax<=2;ax++) setF(18+ax,18+ay,Math.max(Math.abs(ax),Math.abs(ay))!==1);
    function format(mask){
      var d=mask,r=d; for(var i=0;i<10;i++) r=(r<<1)^((r>>9)*0x537);
      var f=((d<<10)|r)^0x5412; function g(i){ return ((f>>i)&1)===1; }
      for(var i2=0;i2<=5;i2++) setF(8,i2,g(i2)); setF(8,7,g(6)); setF(8,8,g(7)); setF(7,8,g(8));
      for(var i3=9;i3<15;i3++) setF(14-i3,8,g(i3));
      for(var i4=0;i4<8;i4++) setF(size-1-i4,8,g(i4));
      for(var i5=8;i5<15;i5++) setF(8,size-15+i5,g(i5));
      setF(8,size-8,true);
    }
    format(0);
    var idx=0;
    for(var right=size-1;right>=1;right-=2){
      if(right===6) right=5;
      for(var vert=0;vert<size;vert++) for(var j=0;j<2;j++){
        var x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;
        if(!fn[y][x]&&idx<all.length){ m[y][x]=all[idx]===1; idx++; }
      }
    }
    function maskFn(k,x,y){ switch(k){
      case 0:return (x+y)%2===0; case 1:return y%2===0; case 2:return x%3===0; case 3:return (x+y)%3===0;
      case 4:return (Math.floor(x/3)+Math.floor(y/2))%2===0; case 5:return x*y%2+x*y%3===0;
      case 6:return (x*y%2+x*y%3)%2===0; default:return ((x+y)%2+x*y%3)%2===0; } }
    function applyMask(k){ for(var y=0;y<size;y++) for(var x=0;x<size;x++) if(!fn[y][x]&&maskFn(k,x,y)) m[y][x]=!m[y][x]; }
    function penalty(){
      var s=0,y,x,run,i;
      for(y=0;y<size;y++){ run=1; for(x=1;x<size;x++){ if(m[y][x]===m[y][x-1]){ run++; if(run===5) s+=3; else if(run>5) s++; } else run=1; } }
      for(x=0;x<size;x++){ run=1; for(y=1;y<size;y++){ if(m[y][x]===m[y-1][x]){ run++; if(run===5) s+=3; else if(run>5) s++; } else run=1; } }
      for(y=0;y<size-1;y++) for(x=0;x<size-1;x++){ var c=m[y][x]; if(c===m[y][x+1]&&c===m[y+1][x]&&c===m[y+1][x+1]) s+=3; }

  }
  return {make:make,svg:svg};
})();

function nameOf(k){ return CARDS.filter(function(c){ return c.k===k; })[0].n; }
function find(card,rk){ var l=RES[card]; for(var i=0;i<l.length;i++) if(l[i].r===rk) return l[i]; return l[0]; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function starSvg(on){ return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.9 7.5.7-5.7 5 1.7 7.4L12 18l-6.5 4 1.7-7.4-5.7-5 7.5-.7z" fill="'+(on?'var(--pink)':'none')+'" stroke="var(--line)" stroke-width="1.5" stroke-linejoin="round"/></svg>'; }

/* ---------- 抽牌流程 ---------- */
function mixedOrder(){
  var o; for(var t=0;t<80;t++){ o=shuffle(CARDS); var ok=true; for(var i=0;i<o.length;i++){ if(i+1<o.length&&o[i].c===o[i+1].c) ok=false; if(i+3<o.length&&o[i].c===o[i+3].c) ok=false; } if(ok) return o; }
  return o;
}
var deck=document.getElementById("deck"), order=mixedOrder(), current=null, demoRedraw=false;
function renderDeck(picked){
  deck.innerHTML=order.map(function(c,i){
    var isP=picked===c.k;
    return '<button type="button" class="tarot t-'+c.c+(picked?(isP?' flip pick':' dim'):'')+'" data-k="'+c.k+'"'+(picked?' disabled':'')+' aria-label="'+(picked?(isP?'已抽到：'+c.n:'未選的牌'):'第 '+(i+1)+' 張牌，點擊翻開')+'">'
      +'<span class="in"><span class="face back"><span>?</span><b>Meibao</b></span><span class="face front"><small>今日項目</small><b>'+esc(c.n)+'</b></span></span></button>';
  }).join("");
  deck.querySelectorAll(".tarot").forEach(function(b){ b.onclick=function(){ pick(b.getAttribute("data-k")); }; });
}
function pick(k){
  var list=RES[k], res=list[Math.floor(Math.random()*list.length)];
  var record=!demoRedraw;
  current={card:k,res:res};
  if(record){ store("meibao_draw",JSON.stringify({d:today(),card:k,r:res.r})); sendDraw(k,res.r); }
  renderDeck(k);
  setTimeout(function(){ showResult(k,res,!record); },record?650:0);
}
function showResult(k,res,isDemo){
  var box=document.getElementById("result"); box.hidden=false;
  var rc=document.getElementById("rCat"); rc.className="rcat t-"+colorOf(k); rc.textContent="今日推薦：「"+nameOf(k)+"」";
  var st=""; for(var i=1;i<=5;i++) st+=starSvg(i<=res.s);
  var sEl=document.getElementById("rStars"); sEl.innerHTML=st; sEl.setAttribute("aria-label","運勢 "+res.s+" 顆星（滿分 5 顆）");
  document.getElementById("rTitle").textContent=res.t;
  document.getElementById("rLine").textContent=res.l;
  document.getElementById("rTip").textContent=res.tip;
  document.getElementById("rColor").textContent=res.c;
  document.getElementById("rTime").textContent=res.tm;
  document.getElementById("goBtn").textContent="去美寶找"+nameOf(k)+"店家";
  document.getElementById("doneNote").textContent=isDemo?"這次是示範重抽，不會計入統計。":"今天的運勢已抽完，明天再來抽一次。";
  document.getElementById("redo").hidden=false;
  document.getElementById("deckHint").textContent="今天已抽過了，結果在下方。";
  document.getElementById("coupon").hidden=true; document.getElementById("couponMsg").textContent="";
  drawShare();
  box.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
}
document.getElementById("redo").onclick=function(){
  demoRedraw=true; current=null; order=mixedOrder(); renderDeck(null);
  document.getElementById("result").hidden=true;
  document.getElementById("deckHint").textContent="示範重抽：這次不會計入統計。";
  document.getElementById("deck").scrollIntoView({block:"center"});
};

/* ---------- 分享圖 ---------- */
var cv=document.createElement("canvas"); cv.width=1080; cv.height=1350;
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrapT(ctx,text,maxW,maxLines){
  var lines=[],line="";
  for(var i=0;i<text.length;i++){ var t=line+text[i]; if(ctx.measureText(t).width>maxW&&line){ lines.push(line); line=text[i]; if(lines.length===maxLines) break; } else line=t; }
  if(lines.length<maxLines&&line) lines.push(line);
  return lines;
}
function starPath(ctx,cx,cy,R){ ctx.beginPath(); for(var i=0;i<10;i++){ var r=i%2?R*.42:R, a=-Math.PI/2+i*Math.PI/5; var x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r; if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y); } ctx.closePath(); }
var seq=0;
function paint(){
  if(!current) return;
  var res=current.res, ctx=cv.getContext("2d"), W=1080,H=1350,M=84,F='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  ctx.clearRect(0,0,W,H); ctx.fillStyle="#FFDCF0"; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalAlpha=.6; ctx.filter="blur(70px)"; ctx.fillStyle="#E9DBFF"; ctx.beginPath(); ctx.arc(W-100,260,260,0,7); ctx.fill(); ctx.restore();
  ctx.textBaseline="alphabetic"; ctx.textAlign="left";
  var y=M+36;
  ctx.fillStyle="#141414"; ctx.font="900 36px "+F; ctx.fillText("Meibao 美寶 · 今日美業運勢",M,y);
  ctx.fillStyle="#5E5A5C"; ctx.font="500 30px "+F; ctx.fillText(today().replace(/-/g," / "),M,y+50);
  y+=50+44;
  var cat="今日推薦：「"+nameOf(current.card)+"」"; ctx.font="700 38px "+F; var cw=ctx.measureText(cat).width+60;
  var hx=HEX[colorOf(current.card)];
  rr(ctx,M,y,cw,66,33); ctx.fillStyle=hx[0]; ctx.fill(); ctx.fillStyle=hx[1]; ctx.fillText(cat,M+30,y+46);
  y+=66+64;
  for(var i=0;i<5;i++){ starPath(ctx,M+30+i*68,y,28); ctx.fillStyle=i<res.s?"#FF3AB1":"rgba(255,255,255,.9)"; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle="#141414"; ctx.stroke(); }
  y+=28+120;
  ctx.fillStyle="#141414"; ctx.font="900 112px "+F;
  wrapT(ctx,res.t,W-M*2,1).forEach(function(l){ ctx.fillText(l,M,y); });
  y+=84;
  ctx.fillStyle="#3A3638"; ctx.font="500 44px "+F;
  wrapT(ctx,res.l,W-M*2,3).forEach(function(l){ ctx.fillText(l,M,y); y+=64; });
  y+=4;
  var items=[["今日建議",res.tip],["幸運色",res.c],["好時段",res.tm]];
  rr(ctx,M,y,W-M*2,items.length*70+36,32); ctx.fillStyle="#FFFFFF"; ctx.fill();
  var py=y+70;
  items.forEach(function(it){ ctx.textAlign="left"; ctx.fillStyle="#FF3AB1"; ctx.font="900 32px "+F; ctx.fillText(it[0],M+40,py); ctx.fillStyle="#141414"; ctx.font="700 36px "+F; ctx.fillText(it[1],M+230,py); py+=70; });
  var qs=190,qx=W-M-qs,qy=H-M-qs;
  rr(ctx,qx-14,qy-14,qs+28,qs+28,24); ctx.fillStyle="#FFFFFF"; ctx.fill();
  var mat=QR.make(SITE),n=mat.length,cell=qs/(n+2); ctx.fillStyle="#141414";
  for(var r=0;r<n;r++) for(var c=0;c<n;c++) if(mat[r][c]) ctx.fillRect(Math.round(qx+(c+1)*cell),Math.round(qy+(r+1)*cell),Math.ceil(cell),Math.ceil(cell));
  ctx.fillStyle="#141414"; ctx.font="900 42px "+F; ctx.fillText("掃描找"+nameOf(current.card)+"店家",M,H-M-60);
  ctx.fillStyle="#FF3AB1"; ctx.font="700 36px "+F; ctx.fillText("meibao.com.tw",M,H-M-10);
  document.getElementById("shareImg").src=cv.toDataURL("image/png");
}
function drawShare(){
  var my=++seq, txt="Meibao 美寶 · 今日美業運勢今日推薦：「」今日建議幸運色好時段掃描找店家0123456789 / "+(current?current.res.t+current.res.l+current.res.tip+current.res.c+current.res.tm:"");
  var p; try{ p=Promise.all(["900","700","500"].map(function(w){ return document.fonts.load(w+' 40px "Noto Sans TC"',txt); })); }catch(e){ p=Promise.resolve(); }
  p.catch(function(){}).then(function(){ if(my===seq) paint(); });
}
var toastT; function say(m){ var e=document.getElementById("toast"); e.textContent=m; clearTimeout(toastT); toastT=setTimeout(function(){ e.textContent=""; },3500); }
document.getElementById("couponBtn").onclick=function(){
  var c=document.getElementById("coupon"); c.hidden=false; c.scrollIntoView({block:"nearest"});
};
document.getElementById("copyBtn").onclick=function(){
  var code="meibao1004", m=document.getElementById("couponMsg");
  function fb(){ var r=document.createRange(); r.selectNodeContents(document.getElementById("couponCode")); var s=getSelection(); s.removeAllRanges(); s.addRange(r); m.textContent="已選取代碼，請按「複製」。"; }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(function(){ m.textContent="已複製代碼 meibao1004"; },fb); } else fb();
};
document.getElementById("dlBtn").onclick=function(){
  try{
    cv.toBlob(function(b){ var a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="今日美業運勢.png"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); },2000); say("已開始下載；若沒有反應，請長按圖片儲存。"); });
  }catch(e){ say("無法自動下載，請長按圖片儲存。"); }
};

/* ---------- Supabase：寫入與統計 ---------- */
function sb(path,opts){
  var ctl=("AbortController" in window)?new AbortController():null, to=setTimeout(function(){ if(ctl) ctl.abort(); },6000);
  opts=opts||{}; opts.headers={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"};
  if(ctl) opts.signal=ctl.signal;
  return fetch(SB_URL+path,opts).then(function(r){ clearTimeout(to); if(!r.ok) throw new Error("http "+r.status); return r; });
}
function sendDraw(k,rk){
  var h={Prefer:"return=minimal"};
  sb("/rest/v1/draws",{method:"POST",body:JSON.stringify({card_key:k,result_key:rk}),headers:h}).then(function(){ return loadStats(); }).catch(function(){});
}
var DEMO_STATS={nail:42,lash:35,hair:28,massage:22,skin:19,tattoo:12};
function renderStats(map,live){
  var max=Math.max.apply(null,CARDS.map(function(c){ return map[c.k]||0; }).concat([1]));
  document.getElementById("bars").innerHTML=CARDS.slice().sort(function(a,b){ return (map[b.k]||0)-(map[a.k]||0); }).map(function(c){
    var n=map[c.k]||0;
    return '<li class="bar t-'+c.c+'"><span>'+esc(c.n)+'</span><span class="track"><span class="fill" style="display:block;width:'+Math.round(n/max*100)+'%"></span></span><span class="n">'+n+'</span></li>';
  }).join("");
  var p=document.getElementById("stPill"); p.textContent=live?"即時資料":"示範數字"; p.className="pill"+(live?" live":"");
  document.getElementById("stHint").textContent=live?"最近 7 天各項目被抽到的次數。":"目前無法連線，以下是示範數字，連線後會顯示真實統計。";
}
function loadStats(){
  return sb("/rest/v1/rpc/draw_stats",{method:"POST",body:JSON.stringify({days:7})}).then(function(r){ return r.json(); }).then(function(rows){
    var m={}; rows.forEach(function(x){ m[x.card_key]=Number(x.n); }); renderStats(m,true);
  }).catch(function(){ renderStats(DEMO_STATS,false); });
}

/* ---------- 啟動：今天抽過就直接顯示結果 ---------- */
var saved=null; try{ saved=JSON.parse(store("meibao_draw")||"null"); }catch(e){}
if(saved&&saved.d===today()&&RES[saved.card]){
  current={card:saved.card,res:find(saved.card,saved.r)};
  renderDeck(saved.card); showResult(saved.card,current.res,false);
} else renderDeck(null);
renderStats(DEMO_STATS,false); loadStats();
</script>
